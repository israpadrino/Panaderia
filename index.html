<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Panadería POS · Prototipo</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#059669;--red:#dc2626;--amber:#d97706;--dark:#0f172a;--r:20px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none}.top{position:sticky;top:0;z-index:20;background:#0f172a;color:white;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:20px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{border:0;background:#1e293b;color:#cbd5e1;padding:10px 12px;border-radius:12px;font-weight:800}.nav button.active,.nav button:hover{background:#334155;color:white}.wrap{max-width:1450px;margin:auto;padding:20px}.card{background:white;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 10px 30px #0f172a14}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900}.primary{background:var(--blue);color:white}.green{background:var(--green);color:white}.red{background:var(--red);color:white}.soft{background:#e2e8f0;color:#0f172a}.amber{background:#f59e0b}.muted{color:var(--muted)}.title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:16px}.title h1{margin:0;font-size:34px}.metric .n{font-size:36px;font-weight:950;margin-top:6px}.metric .l{font-weight:800;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#1d4ed8,#0f172a 55%,#020617)}.loginbox{width:min(460px,100%);background:white;border-radius:28px;padding:32px;box-shadow:0 30px 70px #0006}.logo{width:72px;height:72px;border-radius:22px;background:#f59e0b;display:grid;place-items:center;font-size:38px;margin:0 auto}.field{margin-top:16px}.field label{font-weight:900;display:block;margin-bottom:7px}.input{width:100%;padding:15px;border:2px solid #cbd5e1;border-radius:14px;outline:none}.input:focus{border-color:#2563eb}.hint{background:#eff6ff;color:#1e40af;padding:12px;border-radius:12px;margin-top:16px;font-size:13px}.products{display:grid;grid-template-columns:1fr 400px;gap:16px}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:10px}.cat{white-space:nowrap;border:0;border-radius:14px;background:white;padding:13px 17px;font-weight:900}.cat.active{background:#0f172a;color:white}.prodgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.prod{border:2px solid #e2e8f0;background:white;border-radius:20px;min-height:135px;padding:16px;text-align:left}.prod b{font-size:19px}.price{font-size:26px;color:#047857;font-weight:950;margin-top:15px}.cartrow{display:grid;grid-template-columns:1fr 80px 45px;gap:8px;align-items:center;background:#f8fafc;padding:10px;border-radius:14px;margin-bottom:8px}.qty{border:0;border-radius:12px;background:#2563eb;color:white;padding:11px;font-size:20px;font-weight:950}.x{border:0;border-radius:12px;background:#ef4444;color:white;height:44px;font-size:20px}.total{display:flex;justify-content:space-between;border-top:2px solid var(--line);padding-top:14px;font-size:32px;font-weight:950}.cashbg{background:#020617;min-height:100vh;color:white;padding:18px}.cashgrid{display:grid;grid-template-columns:7fr 5fr;gap:16px}.orderbox{background:white;color:#0f172a;border-radius:22px;padding:18px;min-height:590px}.scan{display:flex;gap:10px;background:#0f172a;border:1px solid #334155;border-radius:18px;padding:14px;margin-bottom:14px}.scan input{flex:1;border:3px solid #3b82f6;border-radius:13px;padding:13px;font-size:22px;font-weight:900}.billgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.bill{height:90px;border:0;border-radius:20px;background:#15803d;color:white;font-size:32px;font-weight:950}.cashdisp,.change{background:#0f172a;border:1px solid #334155;border-radius:20px;padding:16px}.change{background:#1d4ed8}.change.warn{background:#d97706}.money{font-size:54px;font-weight:950}.pay{min-height:105px;border:0;border-radius:22px;background:#34d399;color:#052e16;font-size:28px;font-weight:950}.status{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900}.ok{background:#d1fae5;color:#065f46}.wait{background:#fef3c7;color:#92400e}.blue{background:#dbeafe;color:#1e40af}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:12px;color:var(--muted)}.music{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}.cover{aspect-ratio:1;border-radius:22px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:grid;place-items:center;color:white;font-size:60px}.controls{display:flex;gap:9px;margin-top:14px}.circle{width:55px;height:55px;border-radius:50%;border:0;background:#0f172a;color:white;font-size:20px}.playlist{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}.event{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--line)}.terminal{border:2px solid var(--line);border-radius:18px;padding:15px}.mode{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:800;margin-bottom:12px}.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:white;padding:13px 16px;border-radius:14px;z-index:100;box-shadow:0 20px 50px #0004}.overlay{position:fixed;inset:0;background:#020617bb;display:grid;place-items:center;padding:18px;z-index:80}.numpad{width:min(480px,95vw);background:white;border-radius:24px;padding:20px}.npdisp{text-align:center;background:#f1f5f9;padding:12px;border-radius:15px;font-size:54px;font-weight:950;margin:12px 0}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.keys button{height:75px;border:0;border-radius:14px;background:#e2e8f0;font-size:28px;font-weight:950}@media(max-width:950px){.products,.cashgrid{grid-template-columns:1fr}.prodgrid{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.nav{display:none}}@media(max-width:600px){.wrap{padding:12px}.prodgrid{grid-template-columns:repeat(2,1fr)}.g2,.g3,.g4{grid-template-columns:1fr}.money{font-size:42px}.music{grid-template-columns:1fr}}
</style>
</head><body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)], money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const products=[{id:1,n:'Concha Vainilla',c:'Pan Dulce',p:12},{id:2,n:'Concha Chocolate',c:'Pan Dulce',p:12},{id:3,n:'Cuernito',c:'Pan Dulce',p:15},{id:4,n:'Dona Azúcar',c:'Pan Dulce',p:14},{id:5,n:'Oreja',c:'Pan Dulce',p:13},{id:6,n:'Bolillo',c:'Bolillos',p:4},{id:7,n:'Telera',c:'Bolillos',p:5},{id:8,n:'Baguette',c:'Bolillos',p:22},{id:9,n:'Rebanada Chocolate',c:'Repostería',p:34},{id:10,n:'Tres Leches',c:'Repostería',p:38},{id:11,n:'Muffin',c:'Repostería',p:25},{id:12,n:'Galleta',c:'Galletas',p:10},{id:13,n:'Polvorón',c:'Galletas',p:9}];
const songs=['Morning Bakery','Coffee & Bread','Happy Counter'];
const S={logged:sessionStorage.demo_owner==='1',view:'admin',cat:'Pan Dulce',cart:{},orders:JSON.parse(localStorage.demo_orders||'[]'),sel:null,received:0,volume:+(localStorage.demo_volume||55),playing:true,song:0,playlist:'Mañana tranquila',events:JSON.parse(localStorage.demo_security||'[]'),terms:JSON.parse(localStorage.demo_terminals||'[{"id":1,"name":"Mostrador 1","type":"COUNTER","status":"ACTIVA"},{"id":2,"name":"Caja 1","type":"CASHIER","status":"ACTIVA"}]')};
function save(){localStorage.demo_orders=JSON.stringify(S.orders);localStorage.demo_security=JSON.stringify(S.events);localStorage.demo_terminals=JSON.stringify(S.terms);localStorage.demo_volume=S.volume}
function toast(m){let t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2400)}
function shell(x){let nav=[['admin','Dashboard'],['counter','Mostrador'],['cashier','Caja'],['music','Música'],['terminals','Terminales'],['security','Seguridad']];return `<div><header class="top"><div class="brand">🥖 Panadería POS</div><nav class="nav">${nav.map(v=>`<button data-view="${v[0]}" class="${S.view===v[0]?'active':''}">${v[1]}</button>`).join('')}</nav><div><span class="status blue">OWNER</span> <button id="logout" class="btn soft">Salir</button></div></header>${x}</div>`}
function login(){return `<div class="login"><div class="loginbox"><div class="logo">🥐</div><h1 style="text-align:center">Panadería POS</h1><p class="muted" style="text-align:center">Acceso exclusivo del propietario</p><form id="login"><div class="field"><label>Usuario o correo</label><input class="input" value="admin"></div><div class="field"><label>Contraseña</label><input class="input" type="password" value="Panaderia2026!"></div><button class="btn primary" style="width:100%;margin-top:20px">INICIAR SESIÓN</button></form><div class="hint"><b>Prototipo:</b> cualquier credencial permite entrar. El sistema real valida MySQL, Argon2, dispositivo OWNER y correo.</div></div></div>`}
function dashboard(){let paid=S.orders.filter(o=>o.status==='PAGADO'),sales=paid.reduce((a,o)=>a+o.total,0),pieces=paid.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i.q,0),0);return shell(`<main class="wrap"><div class="title"><div><h1>Panel del dueño</h1><div class="muted">Resumen de la operación</div></div></div><div class="grid g4"><div class="card metric"><div class="l">VENTAS HOY</div><div class="n">${money(sales)}</div></div><div class="card metric"><div class="l">PIEZAS VENDIDAS</div><div class="n">${pieces}</div></div><div class="card metric"><div class="l">PENDIENTES</div><div class="n">${S.orders.filter(o=>o.status==='PENDIENTE').length}</div></div><div class="card metric"><div class="l">MÚSICA</div><div class="n">${S.playing?'▶':'⏸'} ${S.volume}%</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h3>Pedidos recientes</h3><table class="table"><tr><th>Folio</th><th>Estado</th><th>Total</th></tr>${S.orders.slice(-6).reverse().map(o=>`<tr><td><b>${o.folio}</b></td><td><span class="status ${o.status==='PAGADO'?'ok':'wait'}">${o.status}</span></td><td>${money(o.total)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Sin pedidos todavía</td></tr>'}</table></div><div class="card"><h3>Terminales</h3>${S.terms.map(t=>`<div class="terminal" style="margin-top:8px"><b>${t.name}</b><div class="muted">${t.type}</div><span class="status ok">${t.status}</span></div>`).join('')}</div></div></main>`)}
function counter(){let cats=[...new Set(products.map(p=>p.c))],vis=products.filter(p=>p.c===S.cat),items=Object.values(S.cart),tot=items.reduce((a,i)=>a+i.p.p*i.q,0);return shell(`<main class="wrap"><div class="mode">SIMULACIÓN · En producción esta pantalla queda bloqueada como terminal COUNTER.</div><div class="title"><div><h1>Mostrador</h1><div class="muted">Cada toque agrega una pieza. Toca la cantidad para usar el Numpad.</div></div></div><div class="products"><section><div class="cats">${cats.map(c=>`<button class="cat ${c===S.cat?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="prodgrid">${vis.map(p=>`<button class="prod" data-prod="${p.id}"><b>${p.n}</b><div class="muted">${p.c}</div><div class="price">${money(p.p)}</div></button>`).join('')}</div></section><aside class="card"><h2>PEDIDO</h2><div style="min-height:250px">${items.map(i=>`<div class="cartrow"><div><b>${i.p.n}</b><div class="muted">${money(i.p.p)} c/u</div></div><button class="qty" data-qty="${i.p.id}">${i.q}</button><button class="x" data-x="${i.p.id}">×</button></div>`).join('')||'<div class="muted">Toca productos para comenzar.</div>'}</div><div class="total"><span>TOTAL</span><span>${money(tot)}</span></div><button id="create" class="btn green" style="width:100%;margin-top:14px;padding:18px" ${items.length?'':'disabled'}>IMPRIMIR TICKET</button></aside></div></main>`)}
function cashier(){let o=S.sel,tot=o?.total||0,miss=Math.max(0,tot-S.received),chg=Math.max(0,S.received-tot);return `<div class="cashbg"><div class="mode" style="background:#172554;border-color:#1d4ed8;color:#bfdbfe">SIMULACIÓN · Caja CASHIER. Escribe manualmente PED-XXXXX mientras no haya escáner.</div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h1 style="font-size:40px;margin:0">CAJA</h1><button class="btn soft" data-view="admin">Volver</button></div><div class="scan"><input id="scan" placeholder="PED-00001"><button id="search" class="btn primary">BUSCAR</button></div><div class="cashgrid"><section class="orderbox">${!o?'<div style="height:540px;display:grid;place-items:center;text-align:center"><div><div style="font-size:70px">▥</div><h2>INGRESE PED-XXXXX</h2></div></div>':`<div style="display:flex;justify-content:space-between"><h2>${o.folio}</h2><span class="status ${o.status==='PAGADO'?'ok':'wait'}">${o.status}</span></div>${o.items.map(i=>`<div style="display:grid;grid-template-columns:70px 1fr 120px;gap:10px;background:#f8fafc;padding:12px;border-radius:13px;margin:7px 0"><b style="font-size:28px;text-align:center">${i.q}</b><b>${i.n}</b><b style="text-align:right">${money(i.p*i.q)}</b></div>`).join('')}<div class="total" style="font-size:46px;margin-top:16px"><span>TOTAL</span><span>${money(tot)}</span></div>`}</section><section style="display:flex;flex-direction:column;gap:10px"><div class="cashdisp"><div class="muted">EFECTIVO RECIBIDO</div><div class="money">${money(S.received)}</div></div><div class="billgrid">${[50,100,200,500].map(b=>`<button class="bill" data-bill="${b}" ${!o||o.status!=='PENDIENTE'?'disabled':''}>$${b}</button>`).join('')}</div><div class="grid g2"><button id="exact" class="btn primary" ${!o?'disabled':''}>EXACTO</button><button id="clear" class="btn red" ${!o?'disabled':''}>BORRAR</button></div><div class="change ${miss>0?'warn':''}"><b>${miss>0?'FALTA':'CAMBIO'}</b><div class="money">${money(miss>0?miss:chg)}</div></div><button id="pay" class="pay" ${!o||o.status!=='PENDIENTE'||S.received<tot?'disabled':''}>PAGAR Y CERRAR</button></section></div></div>`}
function music(){return shell(`<main class="wrap"><div class="title"><div><h1>Música ambiente</h1><div class="muted">Simulación del módulo Soundtrack</div></div><span class="status blue">Soundtrack · Demo</span></div><div class="grid g2"><div class="card"><div class="music"><div class="cover">♫</div><div><div class="muted">REPRODUCIENDO AHORA</div><h2>${songs[S.song]}</h2><div class="muted">Ambient Sessions</div><div class="controls"><button class="circle" id="prev">⏮</button><button class="circle" id="toggle">${S.playing?'⏸':'▶'}</button><button class="circle" id="next">⏭</button></div></div></div><div style="margin-top:20px"><div style="display:flex;justify-content:space-between"><b>Volumen</b><b>${S.volume}%</b></div><input id="vol" type="range" min="0" max="100" value="${S.volume}" style="width:100%"></div></div><div class="card"><h3>Playlists</h3>${['Mañana tranquila','Hora pico','Tarde relajada','Cierre del día'].map(p=>`<div class="playlist"><div><b>${p}</b><div class="muted">${p===S.playlist?'Activa':'Disponible'}</div></div><button class="btn ${p===S.playlist?'green':'soft'}" data-playlist="${p}">${p===S.playlist?'ACTIVA':'REPRODUCIR'}</button></div>`).join('')}</div></div></main>`)}
function terminals(){return shell(`<main class="wrap"><div class="title"><div><h1>Terminales</h1><div class="muted">Vinculación de navegadores por función</div></div><button id="code" class="btn primary">GENERAR CÓDIGO</button></div><div class="grid g2">${S.terms.map(t=>`<div class="card terminal"><div style="display:flex;justify-content:space-between"><div><h3>${t.name}</h3><div class="muted">${t.type}</div></div><span class="status ok">${t.status}</span></div><div class="grid g2" style="margin-top:12px"><button class="btn soft" data-sim="${t.type}">SIMULAR</button><button class="btn red" data-dis="${t.id}">DESACTIVAR</button></div></div>`).join('')}</div></main>`)}
function security(){return shell(`<main class="wrap"><div class="title"><div><h1>Seguridad</h1><div class="muted">OWNER, dispositivo único y validación por correo</div></div><span class="status ok">PROTEGIDO</span></div><div class="grid g2"><div class="card"><h3>Dispositivo OWNER</h3><p><b>📱 Celular del dueño</b></p><p class="muted">Único dispositivo administrativo autorizado.</p><button id="intruder" class="btn amber">SIMULAR OTRO NAVEGADOR</button></div><div class="card"><h3>Correo real</h3><p class="muted">Un nuevo navegador requiere un código de 6 dígitos enviado al correo del propietario.</p><span class="status blue">SMTP pendiente en prototipo</span></div></div><div class="card" style="margin-top:16px"><h3>Actividad de seguridad</h3>${S.events.length?S.events.slice().reverse().map(e=>`<div class="event"><div>🚨</div><div><b>${e.t}</b><div class="muted">${e.d}</div><small class="muted">${e.time}</small></div></div>`).join(''):'<p class="muted">Sin eventos todavía.</p>'}</div></main>`)}
function render(){if(!S.logged){$('#app').innerHTML=login();$('#login').onsubmit=e=>{e.preventDefault();S.logged=true;sessionStorage.demo_owner='1';S.view='admin';render();toast('Sesión OWNER iniciada')};return}let pages={admin:dashboard,counter,cashier,music,terminals,security};$('#app').innerHTML=pages[S.view]();$$('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render()});$('#logout')?.addEventListener('click',()=>{sessionStorage.removeItem('demo_owner');S.logged=false;render()});if(S.view==='counter')bindCounter();if(S.view==='cashier')bindCash();if(S.view==='music')bindMusic();if(S.view==='terminals')bindTerms();if(S.view==='security')bindSec()}
function bindCounter(){$$('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render()});$$('[data-prod]').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id==b.dataset.prod);S.cart[p.id]??={p,q:0};S.cart[p.id].q++;render()});$$('[data-x]').forEach(b=>b.onclick=()=>{delete S.cart[b.dataset.x];render()});$$('[data-qty]').forEach(b=>b.onclick=()=>numpad(+b.dataset.qty));$('#create')?.addEventListener('click',()=>{let items=Object.values(S.cart).map(i=>({id:i.p.id,n:i.p.n,p:i.p.p,q:i.q}));if(!items.length)return;let n=S.orders.reduce((m,o)=>Math.max(m,+o.folio.split('-')[1]||0),0)+1,folio='PED-'+String(n).padStart(5,'0'),total=items.reduce((a,i)=>a+i.p*i.q,0);S.orders.push({folio,status:'PENDIENTE',total,items});S.cart={};save();render();toast(`Comanda ${folio} creada`)})}
function numpad(id){let i=S.cart[id],val=String(i.q),o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="numpad"><h3 style="text-align:center">${i.p.n}</h3><div class="npdisp">${val}</div><div class="keys">${['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div><div class="grid g2" style="margin-top:9px"><button id="cancel" class="btn red">CANCELAR</button><button id="ok" class="btn green">ACEPTAR</button></div></div>`;document.body.appendChild(o);let upd=()=>$('.npdisp',o).textContent=val||'0';$$('[data-k]',o).forEach(b=>b.onclick=()=>{let k=b.dataset.k;if(k==='C')val='';else if(k==='⌫')val=val.slice(0,-1);else if((val+k).length<=3)val+=k;upd()});$('#cancel',o).onclick=()=>o.remove();$('#ok',o).onclick=()=>{i.q=Math.max(1,+val||1);o.remove();render()}}
function bindCash(){let go=()=>{let c=$('#scan').value.trim().toUpperCase(),o=S.orders.find(x=>x.folio===c);if(!o){S.sel=null;S.received=0;render();toast('Pedido no encontrado')}else{S.sel=o;S.received=0;render();toast(`${c} cargado`)}};$('#search').onclick=go;$('#scan').onkeydown=e=>{if(e.key==='Enter')go()};$$('[data-bill]').forEach(b=>b.onclick=()=>{S.received+=+b.dataset.bill;render()});$('#exact')?.addEventListener('click',()=>{S.received=S.sel?.total||0;render()});$('#clear')?.addEventListener('click',()=>{S.received=0;render()});$('#pay')?.addEventListener('click',()=>{let f=S.sel.folio,c=S.received-S.sel.total;S.sel.status='PAGADO';save();S.sel=null;S.received=0;render();toast(`Venta ${f} pagada · cambio ${money(c)}`)})}
function bindMusic(){$('#toggle').onclick=()=>{S.playing=!S.playing;render()};$('#next').onclick=()=>{S.song=(S.song+1)%songs.length;render()};$('#prev').onclick=()=>{S.song=(S.song-1+songs.length)%songs.length;render()};$('#vol').oninput=e=>{S.volume=+e.target.value;save();render()};$$('[data-playlist]').forEach(b=>b.onclick=()=>{S.playlist=b.dataset.playlist;render();toast('Playlist cambiada')})}
function bindTerms(){$('#code').onclick=()=>{let c=Math.floor(100000+Math.random()*900000),o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="numpad"><h2 style="text-align:center">Código de vinculación</h2><div class="npdisp" style="letter-spacing:5px">${c}</div><button class="btn primary" style="width:100%" id="close">CERRAR</button></div>`;document.body.appendChild(o);$('#close',o).onclick=()=>o.remove()};$$('[data-sim]').forEach(b=>b.onclick=()=>{S.view=b.dataset.sim==='COUNTER'?'counter':'cashier';render()});$$('[data-dis]').forEach(b=>b.onclick=()=>{let t=S.terms.find(x=>x.id==b.dataset.dis);t.status=t.status==='ACTIVA'?'INACTIVA':'ACTIVA';save();render()})}
function bindSec(){$('#intruder').onclick=()=>{S.events.push({t:'Intento desde dispositivo no autorizado',d:'Acceso bloqueado. En producción se enviaría un código al correo del dueño.',time:new Date().toLocaleString('es-MX')});save();render();toast('🚨 Intento bloqueado')}}
render();
</script></body></html>
